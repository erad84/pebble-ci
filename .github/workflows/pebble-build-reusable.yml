# Reusable Pebble SDK build via Docker.
# Call from any Pebble repo (pin @v1; breaking changes get v2):
#   uses: erad84/pebble-ci/.github/workflows/pebble-build-reusable.yml@v1
#
# Optional CloudPebble install (additive; default off — existing @v1 callers unchanged):
#   with:
#     install-cloudpebble: true
#   secrets: inherit   # or pass PEBBLE_FIREBASE_* explicitly
#
# Image: ghcr.io/skylord123/docker-coredevices-pebble-tool (Core Devices pebble-tool + SDK).
# Issues / update requests: https://github.com/erad84/pebble-ci/issues

name: pebble-build-reusable

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Pebble project root (package.json / wscript)
        type: string
        required: false
        default: '.'
      artifact-name:
        description: Name of the uploaded .pbw artifact
        type: string
        required: false
        default: 'pebble-app'
      platforms:
        description: >
          Optional comma-separated targetPlatforms override
          (e.g. basalt,chalk). Empty keeps package.json as-is.
        type: string
        required: false
        default: ''
      pebble-command:
        description: Shell command run inside the container (default pebble build)
        type: string
        required: false
        default: 'pebble build'
      docker-image:
        description: Pebble SDK Docker image
        type: string
        required: false
        default: 'ghcr.io/skylord123/docker-coredevices-pebble-tool:latest'
      npm-install:
        description: >
          Install npm deps before build: auto (if package.json has
          dependencies/devDependencies), true, or false.
        type: string
        required: false
        default: 'auto'
      install-cloudpebble:
        description: >
          After a successful build, optionally install the .pbw to a watch via
          CloudPebble. Requires caller secrets (see PEBBLE_FIREBASE_*). When
          true but the refresh-token secret is empty, the install job skips
          with a notice (build still succeeds).
        type: boolean
        required: false
        default: false
    secrets:
      PEBBLE_FIREBASE_REFRESH_TOKEN:
        description: >
          Firebase refresh_token from local pebble login storage
          (~/.local/share/pebble-sdk/oauth_firebase/firebase_oauth_storage.json).
          Required for CloudPebble install. Never commit this value.
        required: false
      PEBBLE_FIREBASE_API_KEY:
        description: >
          Optional Firebase Web API key. When unset, pebble-tool's public
          default for the Rebble/Core Devices project is used.
        required: false
    outputs:
      artifact-name:
        description: Artifact name that was uploaded
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Optionally override targetPlatforms
        if: inputs.platforms != ''
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = "package.json"
          with open(path, encoding="utf-8") as f:
              pkg = json.load(f)
          platforms = [p.strip() for p in os.environ["PLATFORMS"].split(",") if p.strip()]
          if not platforms:
              raise SystemExit("platforms input produced an empty list")
          pkg.setdefault("pebble", {})["targetPlatforms"] = platforms
          with open(path, "w", encoding="utf-8") as f:
              json.dump(pkg, f, indent=2)
              f.write("\n")
          print("targetPlatforms ->", platforms)
          PY

      - name: Build with Pebble Docker SDK
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          PEBBLE_COMMAND: ${{ inputs.pebble-command }}
          NPM_INSTALL: ${{ inputs.npm-install }}
        run: |
          set -euo pipefail

          need_npm=0
          case "${NPM_INSTALL}" in
            true|yes|1) need_npm=1 ;;
            false|no|0) need_npm=0 ;;
            auto)
              need_npm="$(python3 - <<'PY'
          import json
          pkg = json.load(open("package.json", encoding="utf-8"))
          deps = dict(pkg.get("dependencies") or {})
          deps.update(pkg.get("devDependencies") or {})
          print(1 if deps else 0)
          PY
          )"
              ;;
            *)
              echo "Unknown npm-install value: ${NPM_INSTALL}" >&2
              exit 1
              ;;
          esac

          build_cmd="${PEBBLE_COMMAND}"
          if [ "${need_npm}" = "1" ]; then
            if [ -f package-lock.json ]; then
              build_cmd="npm ci && ${PEBBLE_COMMAND}"
            else
              build_cmd="npm install && ${PEBBLE_COMMAND}"
            fi
            echo "npm install enabled (mode=${NPM_INSTALL})"
          else
            echo "skipping npm install (mode=${NPM_INSTALL})"
          fi

          # Use bash -c (not -lc): a login shell resets PATH and drops
          # /home/pebble/.local/bin where uv installs pebble-tool.
          # --user + HOME=/tmp matches the image README for CI mounts.
          docker run --rm \
            -v "${PWD}:/pebble" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            "${DOCKER_IMAGE}" \
            bash -c "${build_cmd}"

      - name: Upload .pbw artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/build/*.pbw
          if-no-files-found: error

  cloudpebble-install:
    name: cloudpebble-install
    needs: build
    if: ${{ inputs.install-cloudpebble }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check CloudPebble secrets
        id: secrets
        env:
          HAS_REFRESH: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "has-refresh=${HAS_REFRESH}" >> "${GITHUB_OUTPUT}"
          {
            echo "## CloudPebble install gate"
            echo ""
            if [ "${HAS_REFRESH}" != "true" ]; then
              echo "Input \`install-cloudpebble: true\` but caller secret"
              echo "\`PEBBLE_FIREBASE_REFRESH_TOKEN\` is **not set**."
              echo ""
              echo "Build artifact is still available. To enable install:"
              echo "1. Locally run \`pebble login\` (browser)."
              echo "2. Copy **only** the \`refresh_token\` field from"
              echo "   \`~/.local/share/pebble-sdk/oauth_firebase/firebase_oauth_storage.json\`"
              echo "3. Add GitHub Actions secret \`PEBBLE_FIREBASE_REFRESH_TOKEN\` on the **caller** repo."
              echo "4. Optional: \`PEBBLE_FIREBASE_API_KEY\` (defaults to pebble-tool public key)."
              echo "5. Re-run this workflow."
              echo ""
              echo "Pass secrets with \`secrets: inherit\` or explicit \`secrets:\` mapping."
            else
              echo "Refresh token secret is present — proceeding with install."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${HAS_REFRESH}" != "true" ]; then
            echo "::notice title=CloudPebble install skipped::PEBBLE_FIREBASE_REFRESH_TOKEN is not set on the caller repo. Build succeeded; add the secret and re-run to install."
          fi

      - name: Download .pbw artifact
        if: steps.secrets.outputs.has-refresh == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: pbw-artifact

      - name: Install to watch via CloudPebble
        if: steps.secrets.outputs.has-refresh == 'true'
        # Same floating major as the reusable workflow (@v1). Move the v1 tag
        # when releasing so workflow + action stay aligned.
        uses: erad84/pebble-ci/.github/actions/cloudpebble-install@v1
        with:
          pbw-path: pbw-artifact/*.pbw
          docker-image: ${{ inputs.docker-image }}
          refresh-token: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
          api-key: ${{ secrets.PEBBLE_FIREBASE_API_KEY }}
